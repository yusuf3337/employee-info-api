services:
  employee-info-api-db:
    container_name: employee-info-api-mysql-db
    image: jamielsharief/mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: "employee_info_api_db"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
      MYSQL_ROOT_PASSWORD: "password"
    ports:
      - "3306:3306"
    expose:
      - "3306"
    volumes:
      - vol-employee-info-api-db:/var/lib/mysql
volumes:
  vol-employee-info-api-db:
